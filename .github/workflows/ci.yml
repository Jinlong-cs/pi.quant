name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q -m "not modelopt and not ort"
      - run: uv build

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv build
      - run: uv venv --python 3.12 .venv-release
      - run: uv pip install --python .venv-release/bin/python dist/*.whl
      - run: .venv-release/bin/piquant --version
      - run: .venv-release/bin/piquant doctor
      - run: >-
          .venv-release/bin/python -c "import importlib.resources, sys, piquant;
          blocked={'torch','modelopt','onnx','onnxruntime','openpi','fastwam','tensorrt'} & set(sys.modules);
          assert piquant.__version__ == '1.0.0' and importlib.resources.files('piquant').joinpath('py.typed').is_file() and not blocked, blocked"
